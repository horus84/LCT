# Frozen Experiment Preregistration Configuration - COMPUTE BOUNDED RUN

experiment:
  title: "Where Constraints Fail: Phase-Aware Diagnostics for Tool-Calling Language Models"
  random_seed: 42
  budget: "T4 GPU x2, Compute-Bounded 120-Example Run"
  
models:
  primary_matrix:
    - id: "Qwen/Qwen2.5-3B-Instruct"
      revision: "main" 
    - id: "meta-llama/Llama-3.2-3B-Instruct"
      revision: "main"
    - id: "google/gemma-3-4b-it"
      revision: "main"
      
benchmark:
  name: "Berkeley Function Calling Leaderboard (BFCL)"
  version: "V4" 
  subset_size: 120
  categories:
    simple: 30
    multiple_parallel: 30
    complex: 30
    relevance_notool: 30
  split:
    development_count: 40
    test_count: 80

generation:
  max_new_tokens: 512
  do_sample: false # Greedy decoding mandatory
  temperature: null
  top_p: null
  top_k: null
  dtype: "float16"

policies:
  - id: "U_UNCONSTRAINED"
    type: "native"
  - id: "I_IMMEDIATE"
    type: "constrained_start"
  - id: "T_TRIGGER"
    type: "constrained_post_trigger"
    trigger_token: "<tool_call>"
  - id: "D_DCCD"
    type: "two_pass_dccd"

ablations:
  anchor_model: "Qwen/Qwen2.5-3B-Instruct"
  subset_size: 60
  conditions:
    - "Compatible protocol"
    - "Deliberately incompatible protocol"
    - "Incompatible repaired via trigger"
    - "Standard grammar"
    - "Restrictive grammar"
